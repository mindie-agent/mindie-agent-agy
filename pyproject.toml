[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-agy"
version = "0.1.3"
description = "Google Antigravity (AGY) native harness plugin adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.10.0",
    "mindie-diagnostics>=0.5.0",
]

[project.optional-dependencies]
components = [
    "mindie-coordinator>=0.6.0",
    "mindie-debugger>=0.1.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.7.0",
    "npu-top>=0.3.0",
]
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "8645deb20026a3d47ef0aa97e2dbaff619065353" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "7c67876d716feb3949e4dbf33eb5e06980ff0d36" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "f2f2f946c172afc99342a84c0c1ed244f6d44e01" }

[tool.uv]
override-dependencies = [
    "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@8645deb20026a3d47ef0aa97e2dbaff619065353",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@7c67876d716feb3949e4dbf33eb5e06980ff0d36",
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@f2f2f946c172afc99342a84c0c1ed244f6d44e01",
    "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@79a8b28eef72d57f965a01c6660849f024fbb1c0",
    "mindie-debugger @ git+https://github.com/mindie-agent/debugger@e9406b2b178335190d5cb59dff4d6985894497ba",
    "mindie-profiler @ git+https://github.com/mindie-agent/profiler@79d97e75bff7351b0472b93c03b072c1cf47f5e7",
    "mindie-sim @ git+https://github.com/mindie-agent/sim@ced2dba5741af2d98f3a75b2a9cad77b9b94c40d",
    "npu-top @ git+https://github.com/mindie-agent/npu-top@8f0cb3ec66393812e90e118cd73704070c6027a2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
