[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-agy"
version = "0.1.11"
description = "Google Antigravity (AGY) native harness plugin adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.11.9",
    "mindie-diagnostics>=0.5.0",
    "mindie-coordinator>=0.6.0",
    "mindie-debugger>=0.1.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.7.0",
    "npu-top>=0.3.0",
]

[project.optional-dependencies]
components = []
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "315fc4bc51ee9a7afef32a3666599d608ff59f9d" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "3556df571450dab481a25e0157167f1c3727dc6c" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "171623584aa812677df907518dcb55b06493241b" }
mindie-coordinator = { git = "https://github.com/mindie-agent/coordinator", rev = "d8977114e8cd0e5b7befa59a5ff5e53f40a74521" }
mindie-debugger = { git = "https://github.com/mindie-agent/debugger", rev = "d40a250e4048ac63d4a478a5dbfa993702ceddd0" }
mindie-profiler = { git = "https://github.com/mindie-agent/profiler", rev = "79d97e75bff7351b0472b93c03b072c1cf47f5e7" }
mindie-sim = { git = "https://github.com/mindie-agent/sim", rev = "6f1d5a871a7b1ef20ff7a8cab33aaf4637fb3f66" }
npu-top = { git = "https://github.com/mindie-agent/npu-top", rev = "848d74da3cba383c07a0eb372a17baf35b6b944b" }

[tool.uv]
override-dependencies = [
    "mindie-knowledge @ git+https://github.com/mindie-agent/knowledge@315fc4bc51ee9a7afef32a3666599d608ff59f9d",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@3556df571450dab481a25e0157167f1c3727dc6c",
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@171623584aa812677df907518dcb55b06493241b",
    "mindie-coordinator @ git+https://github.com/mindie-agent/coordinator@d8977114e8cd0e5b7befa59a5ff5e53f40a74521",
    "mindie-debugger @ git+https://github.com/mindie-agent/debugger@d40a250e4048ac63d4a478a5dbfa993702ceddd0",
    "mindie-profiler @ git+https://github.com/mindie-agent/profiler@79d97e75bff7351b0472b93c03b072c1cf47f5e7",
    "mindie-sim @ git+https://github.com/mindie-agent/sim@6f1d5a871a7b1ef20ff7a8cab33aaf4637fb3f66",
    "npu-top @ git+https://github.com/mindie-agent/npu-top@848d74da3cba383c07a0eb372a17baf35b6b944b",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
