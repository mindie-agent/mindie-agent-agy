[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mindie-agent-agy"
version = "0.1.1"
description = "Google Antigravity (AGY) native harness plugin adapter for MindIE Agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mindie-knowledge>=0.13.0",
    "remote-dev>=0.10.0",
    "mindie-diagnostics>=0.5.0",
]

[project.optional-dependencies]
components = [
    "mindie-coordinator>=0.6.0",
    "mindie-profiler>=0.5.0",
    "mindie-sim>=0.7.0",
]
test = [
    "pytest>=8,<10",
    "jsonschema>=4",
]

[tool.uv.sources]
mindie-knowledge = { git = "https://github.com/mindie-agent/knowledge", rev = "9a4325858e6fadb10715275826a7795843cbbdf4" }
remote-dev = { git = "https://github.com/mindie-agent/remote-dev", rev = "85be999811771e03ecc7d78e5e560fac1636e7ef" }
mindie-diagnostics = { git = "https://github.com/mindie-agent/diagnostics", rev = "5ae643e19223f2181ecdbaa3edaf464137c4805e" }

[tool.uv]
override-dependencies = [
    "mindie-diagnostics @ git+https://github.com/mindie-agent/diagnostics@5ae643e19223f2181ecdbaa3edaf464137c4805e",
    "remote-dev @ git+https://github.com/mindie-agent/remote-dev@85be999811771e03ecc7d78e5e560fac1636e7ef",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_npu: standing A2/A3 Ascend NPU non-destructive live integration",
]
