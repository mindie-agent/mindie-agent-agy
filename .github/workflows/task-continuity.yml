name: Task continuity contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  continuity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.longpaths
      GIT_CONFIG_VALUE_0: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Install the exact locked runtime
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/mindie-uv
        run: uv sync --locked --no-editable --no-install-project --extra test --python 3.12
      - name: Verify failure isolation and truthful results
        run: uv run --no-sync python -m pytest -q -m "not live_npu"

